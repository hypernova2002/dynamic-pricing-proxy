services:
  rate-api:
    image: tripladev/rate-api
    ports:
      - "8080:8080"

  interview-dev:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
    environment:
      - RATE_API_URL=http://rate-api:8080
      - RATE_API_TOKEN=REPLACE_WITH_RATE_API_TOKEN
    depends_on:
      - rate-api
