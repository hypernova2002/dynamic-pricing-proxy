name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dynamic-pricing
    steps:
    - uses: actions/checkout@v4
    - name: Create compose file
      env:
        RATE_API_TOKEN: ${{ secrets.RATE_API_TOKEN }}
      run: sed "s/REPLACE_WITH_RATE_API_TOKEN/$RATE_API_TOKEN/" docker-compose.example.yml > docker-compose.yml
    - name: Start services
      run: docker compose up -d --build
    - name: Lint
      run: docker compose exec interview-dev bundle exec rubocop
    - name: Run all tests
      run: docker compose exec -e RAILS_ENV=test interview-dev bundle exec rspec
    - name: Test API endpoint returns 200
      run: |
        echo "Testing API endpoint..."
        for i in {1..10}; do
          echo "Attempt $i/10: Testing pricing endpoint..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" 'http://localhost:3000/api/v1/pricing?period=Summer&hotel=FloatingPointResort&room=SingletonRoom' || echo "000")
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ API endpoint returned HTTP 200"
            exit 0
          else
            echo "❌ API endpoint returned HTTP $HTTP_STATUS, retrying in 3 seconds..."
            sleep 3
          fi
        done
        echo "❌ API endpoint failed after 10 attempts"
        exit 1
